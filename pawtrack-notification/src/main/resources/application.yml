server:
  port: 8084

spring:
  application:
    name: pawtrack-notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:pawtrack}
    password: ${RABBITMQ_PASSWORD:pawtrack}
    listener:
      simple:
        # A message that still fails after the retries goes to its <queue>.dlq (never requeued forever).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8180/realms/pawtrack}

pawtrack:
  events:
    exchange: pawtrack.events
    dead-letter-exchange: pawtrack.events.dlx
  reminders:
    # Spring cron (6 fields); "-" disables a job.
    dispatch-cron: ${REMINDER_DISPATCH_CRON:0 * * * * *}
    medication-top-up-cron: ${MEDICATION_TOP_UP_CRON:0 5 * * * *}
    dispatch-batch-size: 100
    medication-horizon-days: 30
    vaccination-lead-days: 7
    vaccination-time: "09:00"
    default-medication-time: "08:00"
    default-timezone: Europe/Sarajevo
  mail:
    from: ${MAIL_FROM:PawTrack <no-reply@pawtrack.local>}
    app-url: ${APP_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
