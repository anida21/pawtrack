openapi: 3.0.3
info:
  title: PawTrack Pet API
  version: 1.1.0
  description: |
    Pets belong to a household. Access rule: the caller must be a member of the pet's
    household (checked via identity `GET /api/v1/me/households`). SITTER may read, not write/delete.
    Unknown and soft-deleted pets are 404; a pet in a household the caller is not a member of is 403.
    If identity cannot be reached, requests that need the membership check return 503.
servers:
  - url: http://pet.pawtrack.local:8082
security:
  - bearerAuth: []
paths:
  /api/v1/pets:
    get:
      summary: Pets in all households of the caller, optionally filtered.
      description: Sorted by name. A `householdId` the caller is not a member of matches no pets (empty page).
      operationId: listPets
      parameters:
        - { name: householdId, in: query, schema: { type: string, format: uuid } }
        - { name: species, in: query, schema: { $ref: '#/components/schemas/Species' } }
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PetPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      summary: Publishes pet.created.
      operationId: createPet
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Pet' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/pets/{petId}:
    parameters: [ { $ref: '#/components/parameters/PetId' } ]
    get:
      summary: Also used by health service as an access check (200 = allowed).
      operationId: getPet
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pet' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Full replace of the editable fields (omitted optional fields are cleared).
      description: Changing `householdId` moves the pet and needs OWNER/MEMBER in both households.
      operationId: updatePet
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PetRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pet' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Soft delete. Publishes pet.deleted.
      operationId: deletePet
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/pets/{petId}/photo:
    parameters: [ { $ref: '#/components/parameters/PetId' } ]
    put:
      summary: Upload/replace profile photo (jpeg/png/webp, max 5 MB). Stored in MinIO bucket pet-photos.
      description: |
        The format is detected from the file content, not from the part's Content-Type.
        OWNER/MEMBER only (403 for SITTER). 400 if the `file` part is missing.
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pet' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
    get:
      summary: Redirect (302) to a pre-signed MinIO URL valid 10 minutes.
      description: 404 if the pet does not exist or has no photo.
      operationId: getPhoto
      responses:
        '302': { description: Redirect to image }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PetId: { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error (RFC 7807)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Species:
      type: string
      enum: [DOG, CAT, RABBIT, BIRD, FISH, REPTILE, RODENT, OTHER]
    Sex:
      type: string
      enum: [MALE, FEMALE, UNKNOWN]
    PetRequest:
      type: object
      required: [householdId, name, species]
      properties:
        householdId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: string, maxLength: 80 }
        sex: { $ref: '#/components/schemas/Sex' }
        birthDate: { type: string, format: date }
        neutered: { type: boolean }
        microchipNumber: { type: string, pattern: '^[0-9]{15}$' }
        color: { type: string, maxLength: 60 }
        notes: { type: string, maxLength: 2000 }
    Pet:
      allOf:
        - $ref: '#/components/schemas/PetRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            ageInMonths: { type: integer, readOnly: true }
            hasPhoto: { type: boolean }
            createdBy: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PetPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Pet' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
