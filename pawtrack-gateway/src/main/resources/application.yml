server:
  port: 8080

spring:
  application:
    name: pawtrack-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same issuer as every service; the token is validated here and relayed downstream unchanged.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.pawtrack.local:8180/realms/pawtrack}
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 30s
  cloud:
    gateway:
      server:
        webmvc:
          # Order matters: health owns sub-resources of /pets, so it must win over the pet catch-all.
          routes:
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              order: 10
              predicates:
                - Path=/api/v1/me/**,/api/v1/households/**,/api/v1/invitations/**
            - id: health
              uri: ${HEALTH_URL:http://localhost:8083}
              order: 20
              predicates:
                - Path=/api/v1/pets/*/vaccinations/**,/api/v1/pets/*/vet-visits/**,/api/v1/pets/*/medications/**,/api/v1/pets/*/weights/**,/api/v1/pets/*/summary/**
            - id: pet
              uri: ${PET_URL:http://localhost:8082}
              order: 30
              predicates:
                - Path=/api/v1/pets/**
            - id: notification
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              order: 40
              predicates:
                - Path=/api/v1/reminders/**
            # Swagger aggregation: /api-docs/<service> -> <service>/v3/api-docs (public)
            - id: identity-api-docs
              uri: ${IDENTITY_URL:http://localhost:8081}
              order: 100
              predicates:
                - Path=/api-docs/identity
              filters:
                - SetPath=/v3/api-docs
            - id: pet-api-docs
              uri: ${PET_URL:http://localhost:8082}
              order: 100
              predicates:
                - Path=/api-docs/pet
              filters:
                - SetPath=/v3/api-docs
            - id: health-api-docs
              uri: ${HEALTH_URL:http://localhost:8083}
              order: 100
              predicates:
                - Path=/api-docs/health
              filters:
                - SetPath=/v3/api-docs
            - id: notification-api-docs
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              order: 100
              predicates:
                - Path=/api-docs/notification
              filters:
                - SetPath=/v3/api-docs

pawtrack:
  cors:
    # Comma-separated in env: CORS_ALLOWED_ORIGINS=http://localhost:4200,https://app.example.org
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Location
    max-age: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# The gateway has no API of its own; Swagger UI lists the services' docs, fetched through the routes above.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: identity
    urls:
      - name: identity
        url: /api-docs/identity
      - name: pet
        url: /api-docs/pet
      - name: health
        url: /api-docs/health
      - name: notification
        url: /api-docs/notification
